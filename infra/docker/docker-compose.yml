# LIS 개발 인프라 — 독립 포트(HIS 5432 / Redis 6379, OpenPACS와 충돌 방지)
services:
  postgres:
    image: postgres:16-alpine
    container_name: lis-postgres
    environment:
      POSTGRES_USER: lis
      POSTGRES_PASSWORD: lis
      POSTGRES_DB: lis
    ports:
      - "5433:5432"
    volumes:
      - lis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lis"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lis-redis
    ports:
      - "6380:6379"

volumes:
  lis_pgdata:
