# LIS nginx 사이트 — 기존 site(hospital-run/sign/twin 등) 미변경, server_name 분리로 격리.
#
# ⚠⚠ **현 파일럿 호스트(ML 서버)는 이 파일을 쓰지 않는다** (2026-09-09 서버 이관).
#   거기서는 Cloudflare Tunnel → Caddy(:8088) → 127.0.0.1:3101/4101 로 공개되고, TLS는 CF 엣지에서 끝난다.
#   이 파일은 **단독 설치 사이트(사이트=서버=DB 1:1:1)의 표준 프록시 구성**으로 계속 유지한다.
#
#   ★이 파일에만 있던 보호 둘 —
#     ① `/api/v1/metrics` 외부 차단(무인증 지표: DLQ 깊이·미전달 위험치 건수)
#        → v1.56.15부터 **앱도 루프백 외 요청을 404로 막는다**(LoopbackOnlyGuard). 여기 설정은
#          이중 방어로 그대로 둔다 — 프록시가 바뀌어도 앱이 남는다는 것이 이관에서 얻은 교훈이다.
#     ② HSTS 헤더
#        → v1.56.18부터 **앱도 보낸다**(API는 helmet, 웹은 next.config). 여기 설정은 이중 방어로 유지.
#   이제 이 파일에만 있는 보호는 없다 — 그래도 지우지 말 것(단독 설치 사이트의 표준 구성이다).
#   조치 내역: docs/서버이관_2026-09-09.md §4-B·§4-E
#
# 설치: sudo cp ~/lis/infra/nginx/lis.example.org.conf /etc/nginx/sites-available/lis.example.org
#       sudo nginx -t && sudo systemctl reload nginx
#
# ⚠ 이 파일은 **certbot이 관리하는 인증서 경로를 포함**한다. 인증서를 새로 발급/갱신 경로가 바뀌면
#   아래 ssl_certificate 두 줄을 맞춰야 한다. (2026-07-12 발급: CN=lis.example.org, 90일 갱신)
#   과거에 이 파일을 certbot 실행 전 버전으로 덮어써 443 블록이 사라진 사고가 있었다 —
#   덮어쓰기 전에 반드시 `sudo cp /etc/nginx/sites-available/lis.example.org{,.bak-$(date +%F)}`.
#
# ⚠ nginx 1.24(Ubuntu) 기준 문법: `listen 443 ssl http2;` — `http2 on;`은 1.25.1+ 전용이라 여기선 오류.
#
# 구성: 클라이언트 → Cloudflare(TLS) → nginx(TLS, 이 파일) → 도커 컨테이너(127.0.0.1:4101/3101)

# websocket 업그레이드 시에만 Connection: upgrade.
# ※다른 site 파일에 동일 map이 이미 있으면 중복 선언 오류 — 그때는 이 블록만 제거할 것.
#   (2026-07-21 확인: sites-enabled·conf.d에 중복 없음)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name lis.example.org;

    location /.well-known/acme-challenge/ { root /var/www/html; } # 인증서 갱신 챌린지만 평문 허용
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lis.example.org;

    ssl_certificate     /etc/letsencrypt/live/lis.example.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lis.example.org/privkey.pem;   # managed by Certbot
    # TLS 프로토콜·암호군을 certbot 권장값으로 통일 — 같은 호스트의 HIS(hospital-run)와 동일 패턴.
    # 이 두 파일은 certbot이 관리하며 갱신 시 함께 최신화된다.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── 보안 헤더 ────────────────────────────────────────────────
    # API 응답에는 helmet(apps/api/src/main.ts)이 붙지만 사용자가 실제로 보는 HTML은 Next.js가 낸다.
    # 그쪽엔 helmet이 없으므로 프록시 계층에서 공통으로 씌운다(앱에도 next.config headers로 이중 적용).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;            # 클릭재킹(결과 승인·수혈 출고 버튼 오버레이) 차단
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;     # 환자ID가 담긴 URL이 외부로 새지 않도록
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 첨부(≤20MB) — 기본값 1MB면 유전체 PDF·병리 이미지 첨부가 413으로 막힌다.
    client_max_body_size 21m;

    # 운영 지표: 무인증 엔드포인트라 외부 접근을 막는다(DLQ 깊이·미전달 위험치 건수 등 정찰 방지).
    #   Cloudflare 경유 요청의 $remote_addr는 CF 엣지 IP이므로 사실상 외부 전체가 차단된다.
    #   호스트 내부 스크레이퍼는 nginx를 거치지 않고 127.0.0.1:4101을 직접 수집하면 된다.
    location = /api/v1/metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:4101/api/v1/metrics;
        proxy_set_header Host $host;
    }

    # API (NestJS)
    location /api/ {
        proxy_pass http://127.0.0.1:4101/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ★Cloudflare가 앞단에 있으므로 XFF는 '덧붙이기'가 맞다.
        #   CF가 실제 클라이언트 IP를 XFF에 넣어 보내고, nginx가 CF 엣지 IP를 오른쪽에 덧붙인다.
        #   앱은 TRUST_PROXY_HOPS=2로 오른쪽 2홉(nginx·CF)을 건너뛰어 실제 클라이언트를 얻는다.
        #   여기서 $remote_addr로 덮어쓰면 CF 엣지 IP만 남아 실제 클라이언트를 잃는다(감사·레이트리밋 열화).
        #   클라이언트가 위조한 XFF 값은 체인 왼쪽에 남을 뿐 홉 계산에서 채택되지 않는다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web (Next.js) — 나머지 전체
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
